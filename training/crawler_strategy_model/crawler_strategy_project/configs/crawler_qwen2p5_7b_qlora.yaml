# 中文功能说明：项目 YAML 配置文件，定义训练参数或 Kubernetes 部署资源。

model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true
flash_attn: disabled
quantization_bit: 4

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

dataset_dir: data
dataset: crawler_sft_train
eval_dataset: crawler_sft_eval
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: outputs/qwen2p5-7b-crawler-qlora
overwrite_output_dir: true
save_strategy: steps
save_steps: 200
save_total_limit: 3
logging_steps: 10
plot_loss: true
report_to: none

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.00005
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01

eval_strategy: steps
eval_steps: 200
val_size: 0.0

fp16: true
bf16: false
ddp_timeout: 180000000
