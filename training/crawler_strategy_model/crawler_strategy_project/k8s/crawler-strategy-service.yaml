# 中文功能说明：Crawler Strategy Kubernetes 部署配置，定义服务命令、GPU 资源和 NodePort。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-strategy-service
  namespace: default
  labels:
    app: crawler-strategy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawler-strategy-service
  template:
    metadata:
      labels:
        app: crawler-strategy-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: "11.11.11.5"
      containers:
        - name: crawler-strategy-service
          image: selector-reranker-service:20260624
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - >
              python /app/service/serve_crawler_strategy.py
              --base-model /app/.cache/modelscope/models/Qwen/Qwen2___5-3B-Instruct
              --adapter-dir /app/outputs/qwen2p5-3b-crawler-lora-r16-e3
              --host 0.0.0.0
              --port 8000
          env:
            - name: HF_HOME
              value: /tmp/huggingface
            - name: TRANSFORMERS_CACHE
              value: /tmp/huggingface
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 10Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 24Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 6
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            failureThreshold: 4
            periodSeconds: 30
          volumeMounts:
            - name: project
              mountPath: /app
      volumes:
        - name: project
          hostPath:
            path: /data/model_train/crawler_strategy_model/crawler_strategy_project
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: crawler-strategy-service
  namespace: default
  labels:
    app: crawler-strategy-service
spec:
  type: NodePort
  selector:
    app: crawler-strategy-service
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 32183
