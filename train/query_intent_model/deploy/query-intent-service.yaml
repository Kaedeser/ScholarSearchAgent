apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-intent-service
  namespace: default
  labels:
    app: query-intent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-intent-service
  template:
    metadata:
      labels:
        app: query-intent-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: 11.11.11.5
      containers:
        - name: query-intent-service
          image: ai-harbor.wust.edu.cn/master-23-liuhaijun/bert:1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - >-
              python /app/serve_query_intent.py
              --model-root /app/models
              --host 0.0.0.0
              --port 8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: app-data
              mountPath: /app
      volumes:
        - name: app-data
          hostPath:
            path: /data/csp/query-intent-service
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: query-intent-service
  namespace: default
  labels:
    app: query-intent-service
spec:
  type: NodePort
  selector:
    app: query-intent-service
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 22436
