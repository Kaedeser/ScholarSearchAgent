apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-reranker
  namespace: default
  labels:
    app: selector-reranker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selector-reranker
  template:
    metadata:
      labels:
        app: selector-reranker
    spec:
      nodeSelector:
        kubernetes.io/hostname: "11.11.11.5"
      containers:
        - name: selector-reranker
          image: selector-reranker-service:20260624
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_DIR
              value: /models/selector-reranker
            - name: PORT
              value: "8000"
            - name: MAX_LENGTH
              value: "512"
            - name: BATCH_SIZE
              value: "16"
            - name: THRESHOLD
              value: "0.991881787776947"
            - name: USE_FP16
              value: "false"
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 20Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model
              mountPath: /models/selector-reranker
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: model
          hostPath:
            path: /data/csp/selector-reranker/model
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: selector-reranker
  namespace: default
  labels:
    app: selector-reranker
spec:
  type: NodePort
  selector:
    app: selector-reranker
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 32082
